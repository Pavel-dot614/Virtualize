<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сравнение блокировки JS</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 40px;
      text-align: center;
    }
    h1 {
      margin-bottom: 24px;
    }
    button {
      font-size: 16px;
      padding: 10px 20px;
      margin: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .blocking {
      background-color: #e74c3c;
      color: white;
    }
    .non-blocking {
      background-color: #2ecc71;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Сравнение блокирующего и неблокирующего JS</h1>
  <button class="blocking" onclick="location.href='blocking-example.html'">Блокирующий скрипт</button>
  <button class="non-blocking" onclick="location.href='non-blocking-example.html'">Неблокирующий скрипт</button>
</body>
</html>
